<!DOCTYPE html>
<html>
<head>
  <title>TabTidy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>TabTidy</h1>
  <button id="groupTabs">Group Tabs</button>
  <button id="focusMode">Focus Mode: Off</button>
  <h2>Tab Groups</h2>
  <div id="groups"></div>
  <h2>Saved Sessions</h2>
  <input id="sessionName" placeholder="Session Name">
  <button id="saveSession">Save Session</button>
  <ul id="sessions"></ul>
  <h2>Stale Tabs</h2>
  <button id="closeStale">Close Stale Tabs</button>
  <ul id="staleTabs"></ul>
  <script src="popup.js"></script>
</body>
</html>
