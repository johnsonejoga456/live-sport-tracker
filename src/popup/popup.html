<!DOCTYPE html>
<html>
<head>
  <title>FocusGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>FocusGuard</h1>
  <p>Time Spent: <span id="timeSpent">0</span> seconds</p>
  
  <label>Break Interval (minutes):</label>
  <input type="number" id="interval" min="1" value="30">
  
  <label>Focus Hours:</label>
  <input type="time" id="focusStart" value="09:00">
  <input type="time" id="focusEnd" value="17:00">
  
  <button id="save">Save Settings</button>
  
  <script src="popup.js"></script>
</body>
</html>
