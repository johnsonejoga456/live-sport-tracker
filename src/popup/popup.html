<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Manager</title>
    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        button {
            display: block;
            width: 100%;
            margin-bottom: 5px;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #group-list {
            margin-top: 10px;
            padding: 5px;
            border-top: 1px solid #ccc;
        }
        .group-item {
            padding: 5px;
            margin: 2px 0;
            background: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <button id="group-tabs">Group Similar Tabs</button>
    <button id="show-groups">Show Groups</button>
    <div id="group-list"></div>
    <script src="popup.js"></script>
</body>
</html>
